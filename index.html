<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalles AR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3f5;
            color: #333;
            text-align: center;
        }

        header {
            background: #d81b60;
            color: white;
            padding: 50px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            font-size: 18px;
            margin-top: 10px;
        }

        .contenido {
            padding: 40px 20px;
        }

        .tarjeta {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .boton {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #d81b60;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .boton:hover {
            background: #ad124d;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Detalles AR</h1>
        <p>Regalos hechos con cariño ❤️</p>
    </header>

    <section class="contenido">

        <div class="tarjeta">
            <h2>Bienvenidos</h2>

            <p>
                Creamos detalles personalizados para momentos especiales.
            </p>

            <a class="boton" href="https://wa.me/" target="_blank">
                Contáctanos
            </a>
        </div>

    </section>

    <footer>
        © 2026 Detalles AR
    </footer>

</body>
</html>
