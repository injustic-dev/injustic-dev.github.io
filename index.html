<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#030305"
    >

    <meta
        name="description"
        content="AR Detalles — detalles únicos creados para convertir momentos especiales en recuerdos inolvidables."
    >

    <title>AR Detalles</title>

    <link
        rel="icon"
        type="image/png"
        href="icon.png"
    >

    <!-- =====================================================
         CSS MODULAR
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/header.css"
    >

    <link
        rel="stylesheet"
        href="css/hero.css"
    >

    <link
        rel="stylesheet"
        href="css/buttons.css"
    >

    <link
        rel="stylesheet"
        href="css/background.css"
    >

    <link
        rel="stylesheet"
        href="css/animations.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>

<div
    id="scene"
    class="scene"
>


    <!-- =====================================================
         FONDO ANIMADO
         ===================================================== -->

    <div
        class="background-effects"
        aria-hidden="true"
    >

        <div class="aurora aurora-one"></div>

        <div class="aurora aurora-two"></div>

        <div class="aurora aurora-three"></div>


        <div class="background-core"></div>


        <div class="orbit orbit-one">

            <span class="orbit-object"></span>

        </div>


        <div class="orbit orbit-two">

            <span class="orbit-object"></span>

        </div>


        <div class="orbit orbit-three">

            <span class="orbit-object"></span>

        </div>


        <div class="nebula nebula-one"></div>

        <div class="nebula nebula-two"></div>


        <div
            id="light-effects"
        ></div>


        <div
            id="particles"
        ></div>

    </div>


    <!-- =====================================================
         EFECTOS DE INTERACCIÓN
         ===================================================== -->

    <div
        id="interaction-layer"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <a
            href="index.html"
            class="brand"
            aria-label="AR Detalles - Inicio"
        >

            <div class="brand-logo">

                <img
                    src="icon.png"
                    alt="AR Detalles"
                >

            </div>


            <div class="brand-name">

                <span class="brand-main">
                    AR
                </span>

                <span class="brand-sub">
                    DETALLES
                </span>

            </div>

        </a>

    </header>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    <main class="hero">


        <div
            class="hero-decoration decoration-left"
            aria-hidden="true"
        >

            <span></span>
            <span></span>
            <span></span>

        </div>


        <div
            class="hero-decoration decoration-right"
            aria-hidden="true"
        >

            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="hero-content">


            <!-- =================================================
                 INSIGNIA
                 ================================================= -->

            <div class="hero-badge">

                <span class="badge-line"></span>

                <span>
                    DETALLES QUE CUENTAN HISTORIAS
                </span>

                <span class="badge-line"></span>

            </div>


            <!-- =================================================
                 SUBTÍTULO
                 ================================================= -->

            <p class="hero-subtitle">
                Hecho con intención
            </p>


            <!-- =================================================
                 TÍTULO
                 ================================================= -->

            <h1 class="hero-title">

                <span class="title-small">
                    Creamos
                </span>

                <span class="title-main">
                    momentos
                </span>

                <span class="title-accent">
                    inolvidables
                </span>

            </h1>


            <!-- =================================================
                 DESCRIPCIÓN
                 ================================================= -->

            <p class="hero-description">

                Detalles únicos creados para convertir
                momentos especiales en recuerdos que
                permanecen para siempre.

            </p>


            <!-- =================================================
                 BOTONES
                 ================================================= -->

            <div class="hero-buttons">


                <!-- =============================================
                     CATÁLOGO
                     ============================================= -->

                <a
                    href="catalogo/index.html"
                    class="main-button catalog-button"
                    target="_blank"
                    rel="noopener"
                    aria-label="Abrir catálogo"
                >

                    <span class="button-glow"></span>


                    <span class="button-content">


                        <span class="button-icon">
                            ✦
                        </span>


                        <span class="button-text">

                            <strong>
                                CATÁLOGO
                            </strong>

                            <small>
                                Descubre nuestros detalles
                            </small>

                        </span>


                        <span class="button-arrow">
                            →
                        </span>


                    </span>

                </a>


                <!-- =============================================
                     NOSOTROS
                     ============================================= -->

                <a
                    href="nosotros/index.html"
                    class="main-button about-button"
                    target="_blank"
                    rel="noopener"
                    aria-label="Conocer AR Detalles"
                >

                    <span class="button-glow"></span>


                    <span class="button-content">


                        <span class="button-icon">
                            ♡
                        </span>


                        <span class="button-text">

                            <strong>
                                NOSOTROS
                            </strong>

                            <small>
                                Conoce nuestra historia
                            </small>

                        </span>


                        <span class="button-arrow">
                            →
                        </span>


                    </span>

                </a>


            </div>


            <!-- =================================================
                 INDICADOR
                 ================================================= -->

            <div class="hero-scroll-indicator">

                <span class="scroll-line"></span>

                <span>
                    EXPLORA
                </span>

                <span class="scroll-line"></span>

            </div>


        </div>

    </main>


    <!-- =====================================================
         SÍMBOLOS FLOTANTES
         ===================================================== -->

    <span
        class="floating-symbol symbol-one"
        aria-hidden="true"
    >
        ✦
    </span>


    <span
        class="floating-symbol symbol-two"
        aria-hidden="true"
    >
        ✧
    </span>


    <span
        class="floating-symbol symbol-three"
        aria-hidden="true"
    >
        ⋆
    </span>


    <span
        class="floating-symbol symbol-four"
        aria-hidden="true"
    >
        ✶
    </span>


</div>


<!-- =========================================================
     CONFIGURACIÓN DE ANIMACIONES
     ========================================================= -->

<script
    id="animation-config"
    type="application/json"
>
{
    "particles": {
        "count": 110,
        "minSize": 1,
        "maxSize": 4,
        "minDuration": 4,
        "maxDuration": 10
    },

    "stars": {
        "clickCount": 30,
        "minDistance": 45,
        "maxDistance": 160,

        "symbols": [
            "✦",
            "✧",
            "⋆",
            "✶",
            "·"
        ]
    },

    "cursor": {
        "enabled": true,
        "lightFollow": true,
        "parallax": true,
        "strength": 10
    },

    "navigation": {
        "duration": 650
    }
}
</script>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script
    src="js/effects.js"
    defer
></script>


</body>

</html>
