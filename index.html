<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Detalles</title>

    <!-- Icono -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- CSS principal -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS modular -->
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- Fondo -->
    <div class="background-effects">

        <span class="glow glow-one"></span>
        <span class="glow glow-two"></span>
        <span class="glow glow-three"></span>

    </div>


    <!-- Encabezado -->
    <header class="header">

        <a href="index.html" class="brand">

            <img
                src="icon.png"
                alt="AR Detalles"
            >

            <span>AR Detalles</span>

        </a>

    </header>


    <!-- Contenido principal -->
    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="hero-subtitle">
                    Detalles que hacen especial cada momento
                </p>

                <h1>
                    <span>AR</span> Detalles
                </h1>

                <p class="hero-description">
                    Creamos detalles únicos para convertir
                    momentos especiales en recuerdos inolvidables.
                </p>


                <!-- Navegación principal -->
                <div class="hero-buttons">

                    <a
                        href="catalogo/index.html"
                        class="main-button catalogo-button"
                    >
                        <span class="button-icon">✦</span>
                        Catálogo
                    </a>


                    <a
                        href="nosotros/index.html"
                        class="main-button nosotros-button"
                    >
                        <span class="button-icon">✧</span>
                        Nosotros
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Pie de página -->
    <footer class="footer">

        <p>
            © 2026 AR Detalles · Todos los derechos reservados
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/effects.js"></script>

</body>

</html>
